<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuno Amaro — Portfolio</title>
    <meta name="description" content="Portfolio de Nuno Amaro, étudiant en ingénierie des médias à la HEIG-VD, spécialisé en UX/UI et développement front-end." />
    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <link rel="preload" href="/assets/img/Nuno_photo2.jpg" as="image" />
    <link rel="preload" href="/assets/fonts/general-sans-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/general-sans-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="app">
      <!-- Site header: persistent, logo left / menu right (mirrors reference) -->
      <header class="site-header" id="site-header">
        <a class="brand-lockup" href="#top" aria-label="Nuno Amaro — accueil">
          <span class="brand-word">NUNO</span>
        </a>
        <div class="header-right">
          <details class="language-switcher" id="language-switcher">
            <summary class="language-trigger" aria-label="Choose language">
              <span id="language-current">Français</span>
              <svg class="language-chevron" viewBox="0 0 12 8" fill="none" aria-hidden="true">
                <path d="m1 1 5 5 5-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </summary>
            <div class="language-options" role="group" aria-label="Choose language">
              <button class="lang-btn" type="button" data-lang="fr" aria-pressed="true">Français <span>FR</span></button>
              <button class="lang-btn" type="button" data-lang="en" aria-pressed="false">English <span>EN</span></button>
              <button class="lang-btn" type="button" data-lang="pt" aria-pressed="false">Português <span>PT</span></button>
            </div>
          </details>
          <button class="menu-btn" id="menu-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="menu-overlay">
            <span>menu</span>
            <svg class="menu-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8h16M4 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>

      <!-- Menu overlay -->
      <div class="menu-overlay" id="menu-overlay" role="dialog" aria-modal="true" aria-label="Menu principal" hidden>
        <nav class="menu-nav" id="menu-nav" aria-label="Primary"></nav>
        <button class="menu-close" id="menu-close" aria-label="Fermer le menu">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <!-- Hero intro overlay: centered wordmark, holds then reveals -->
      <div class="intro" id="intro" aria-hidden="true">
        <div class="intro-center">
          <span class="intro-word">nuno</span>
        </div>
        <div class="intro-corner intro-corner--bl">
          <span id="intro-role-1">INGÉNIEUR DES MÉDIAS</span>
          <span id="intro-role-2">DESIGN · DÉVELOPPEMENT</span>
        </div>
        <div class="intro-corner intro-corner--br">
          <span id="intro-scroll-label">DÉFILER</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v16m0 0l-6-6m6 6l6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>

      <main id="top">
        <!-- Hero -->
        <section class="hero" id="hero" aria-label="Présentation de Nuno Amaro">
          <div class="hero-shell">
            <div class="hero-stage">
              <div class="hero-visual">
                <div class="hero-orbits" aria-hidden="true">
                  <span class="hero-orbit hero-orbit-outer"></span>
                  <span class="hero-orbit hero-orbit-inner"></span>
                  <span class="hero-orbit hero-orbit-small"></span>
                </div>
                <figure class="hero-media" id="hero-media">
                  <video class="hero-video is-active" muted autoplay loop playsinline preload="auto" aria-hidden="true" poster="/assets/img/projets/f1/f1HeroSection.png">
                    <source src="/assets/videos/videoStars.mp4" type="video/mp4" />
                  </video>
                  <span class="hero-scene-shade" aria-hidden="true"></span>
                </figure>
                <div class="hero-subject-transition" aria-hidden="true">
                  <div class="hero-subject sujet-parallax">
                    <div class="sujet-respiration">
                      <img class="hero-subject-image" id="hero-cutout" src="/assets/img/sillouetteMoi.png" alt="Silhouette de Nuno Amaro, assis de trois quarts arrière" fetchpriority="high" />
                      <span class="hero-subject-tint"></span>
                    </div>
                  </div>
                </div>
              </div>
              <h1 class="hero-title" id="hero-title">
                <span class="hero-lead" id="hero-title-lead">Du</span>
                <span class="hero-word-top" id="hero-title-top">design</span>
                <span class="hero-word-bottom" id="hero-title-bottom">au digital</span>
              </h1>
            </div>
            <div class="hero-word-cloud" id="hero-word-cloud" aria-hidden="true"></div>
            <p class="hero-intro" id="hero-intro"></p>
          </div>
        </section>

        <!-- Product index row -->
        <section class="pindex" id="pindex" aria-label="Product lines"></section>

        <!-- Craft (services) -->
        <section class="services" id="services" aria-label="Craft"></section>

        <!-- Selected projects -->
        <section class="projects-section" id="projects">
          <h2 class="section-title projects-title">
            <span class="st-line"><span class="st-inner" id="projects-title"></span></span>
          </h2>
          <nav class="projects-filterbar" id="projects-filterbar" aria-label="Filtrer les projets"></nav>
          <div class="pcards projects-carousel" id="pcards" role="region" tabindex="0" aria-label="Featured projects" aria-labelledby="projects-title">
            <div class="projects-carousel-stage"></div>
          </div>
        </section>

        <!-- Tools marquee -->
        <section class="tools-section" id="tools" aria-label="Tools I use"></section>

        <!-- Footer CTA + footer -->
        <footer class="footer" id="footer" aria-label="Footer"></footer>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
