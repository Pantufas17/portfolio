<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Nuno Amaro</title>
    <meta
      name="description"
      content="Contactez Nuno Amaro pour un projet, une collaboration ou un stage."
    />
    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/animations.css" />
    <style>
      .contact-page {
        min-height: 72vh;
        padding-block: clamp(9rem, 17vh, 13rem) clamp(5rem, 10vw, 9rem);
      }
      .contact-content {
        width: min(100%, 980px);
        margin-inline: auto;
      }
      .contact-meta {
        margin-bottom: clamp(2rem, 5vw, 4rem);
      }
      .contact-title {
        max-width: 14ch;
        margin-bottom: clamp(1.25rem, 3vw, 2rem);
        font-size: clamp(2.75rem, 8.5vw, 7rem);
        font-weight: 400;
        line-height: 0.98;
        letter-spacing: -0.055em;
      }
      .contact-title strong {
        color: var(--text);
        font-weight: 700;
      }
      .contact-title span {
        color: var(--text-muted);
      }
      .contact-lead {
        max-width: 62ch;
        margin-bottom: clamp(3rem, 7vw, 5.5rem);
      }
      .contact-direct-label {
        display: block;
        margin-bottom: 0.75rem;
        color: var(--text-subtle);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .contact-links {
        display: flex;
        flex-direction: column;
      }
      .contact-links .contact-link {
        min-height: 94px;
        padding: 1.25rem 0;
        border: 0;
        border-top: 1px solid var(--border);
        border-radius: 0;
        background: transparent;
        gap: 1.25rem;
      }
      .contact-links .contact-link:last-child {
        border-bottom: 1px solid var(--border);
      }
      .contact-links .contact-link:hover {
        transform: none;
        box-shadow: none;
      }
      .contact-links .contact-link__icon {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--surface-alt);
        color: var(--text);
      }
      .contact-links .contact-link:hover .contact-link__icon {
        background: var(--accent);
      }
      .contact-links .contact-link__label {
        margin-bottom: 0.2rem;
      }
      .contact-links .contact-link__value {
        font-size: clamp(1rem, 2.2vw, 1.35rem);
        overflow-wrap: anywhere;
      }
      @media (max-width: 720px) {
        .contact-page {
          min-height: 0;
          padding-top: 8rem;
        }
        .contact-meta {
          margin-bottom: 2.5rem;
        }
        .contact-title {
          font-size: clamp(2.65rem, 11vw, 4.5rem);
        }
        .contact-lead {
          margin-bottom: 3rem;
        }
      }
    </style>
    <script src="/js/i18n.js" defer></script>
    <script src="/js/main.js" defer></script>
    <script src="/js/animations.js" defer></script>
    <script src="/js/site-shell.js" defer></script>
  </head>
  <body>
    <main>
      <section class="contact-page">
        <div class="container">
          <div class="contact-content">
            <div class="section-header__meta contact-meta">
              <span class="section-header__number" data-i18n="cp.label">Contact</span>
              <div class="section-header__line"></div>
              <span class="section-header__label" data-i18n="cp.sublabel">Prendre contact</span>
            </div>

            <h1 class="contact-title hero-enter hero-enter-1" data-i18n-html="cp.title">
              <span>Parlons de votre</span><br />
              <strong>prochain projet.</strong>
            </h1>

            <p class="text-lead contact-lead hero-enter hero-enter-2" data-i18n="cp.lead">
              Un projet, une collaboration, un stage ou un sujet pour mon travail de Bachelor ? Écrivez-moi, je vous répondrai avec plaisir.
            </p>

            <div class="reveal">
              <span class="contact-direct-label" data-i18n="cp.direct">Ou directement</span>
              <div class="contact-links">
                <a href="mailto:nunoamarofaria@hotmail.com" class="contact-link">
                  <div class="contact-link__icon" aria-hidden="true">✉</div>
                  <div>
                    <div class="contact-link__label" data-i18n="cp.email">E-mail</div>
                    <div class="contact-link__value">nunoamarofaria@hotmail.com</div>
                  </div>
                </a>

                <a href="https://www.linkedin.com/in/amaro-nuno/" class="contact-link" target="_blank" rel="noopener noreferrer">
                  <div class="contact-link__icon" aria-hidden="true">in</div>
                  <div>
                    <div class="contact-link__label">LinkedIn</div>
                    <div class="contact-link__value">linkedin.com/in/amaro-nuno/</div>
                  </div>
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
