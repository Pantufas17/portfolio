<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Nuno Amaro</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <style>
    .not-found-bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 60%, var(--accent-light) 0%, transparent 65%);
      pointer-events: none;
    }
    .not-found__label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-light);
      border: 1px solid rgba(108,99,255,0.2);
      padding: 5px 14px;
      border-radius: 9999px;
      margin-bottom: 2rem;
    }
    .glitch {
      position: relative;
      display: inline-block;
    }
    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      color: var(--accent);
      opacity: 0;
    }
    .glitch:hover::before {
      opacity: 0.6;
      animation: glitch1 0.4s steps(2) infinite;
    }
    .glitch:hover::after {
      opacity: 0.4;
      color: #ff6b6b;
      animation: glitch2 0.4s steps(2) infinite;
    }
    @keyframes glitch1 {
      0%   { clip-path: inset(20% 0 60% 0); transform: translateX(-4px); }
      100% { clip-path: inset(70% 0 10% 0); transform: translateX(4px); }
    }
    @keyframes glitch2 {
      0%   { clip-path: inset(60% 0 20% 0); transform: translateX(4px); }
      100% { clip-path: inset(10% 0 70% 0); transform: translateX(-4px); }
    }
    .not-found__actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

<div class="cursor-dot" aria-hidden="true"></div>
<div class="cursor-ring" aria-hidden="true"><span class="cursor-label"></span></div>

<header class="navbar">
  <div class="navbar__inner">
    <a href="index.html" class="navbar__logo">
      <div class="logo-mark">NA</div>
      <span class="logo-text">Nuno Amaro</span>
    </a>
    <div class="navbar__actions">
      <button class="theme-toggle" aria-label="Toggle theme"><span class="theme-toggle-icon">☾</span></button>
    </div>
  </div>
</header>

<div class="not-found-bg" aria-hidden="true"></div>

<main>
  <div class="not-found fade-in">
    <div class="not-found__label">🧭 Error 404</div>

    <div class="not-found__number glitch" data-text="404" aria-hidden="true">404</div>

    <h1 style="margin-bottom:1rem; font-size:clamp(1.75rem, 3vw, 2.5rem);">
      Looks like you took<br />a wrong turn.
    </h1>

    <p class="text-lead" style="max-width:36ch; margin-inline:auto; margin-bottom:3rem;">
      This page doesn't exist — but the rest of the portfolio definitely does.
    </p>

    <div class="not-found__actions">
      <a href="index.html" class="btn btn-primary">
        ← Back home
      </a>
      <a href="index.html#work" class="btn btn-secondary">
        View my work
      </a>
    </div>

    <p style="margin-top:4rem; font-size:0.78rem; color:var(--text-subtle);">
      If you expected to find something here, <a href="contact.html" style="color:var(--accent);">let me know</a>.
    </p>
  </div>
</main>

<script src="js/main.js"   defer></script>
<script src="js/cursor.js" defer></script>
</body>
</html>
